##### --- General Options ---

# Enable mouse support
set -g mouse on

##### --- Pane Management ---

# Split panes
bind | split-window -h
bind - split-window -v

# Move between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Swap panes
bind H run-shell 'tmux swap-pane -t !; tmux select-pane -L'
bind L run-shell 'tmux swap-pane -t !; tmux select-pane -R'

# Resize panes with prefix + Alt + hjkl (repeatable: keep tapping Alt + hjkl).
# Behind the prefix so a bare Alt-h/Alt-l still reaches nvim's buffer switching.
bind -r M-h resize-pane -L 2
bind -r M-l resize-pane -R 2
bind -r M-j resize-pane -D 2
bind -r M-k resize-pane -U 2

##### --- Copy Mode ---

# Copy mode uses vi keys
setw -g mode-keys vi

bind -T copy-mode-vi v if-shell -F '#{selection_present}' 'send -X clear-selection' 'send -X begin-selection'
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi Escape send -X cancel
# Let programs (nvim) set the clipboard with OSC 52, and pass it on to the
# outer terminal; over SSH that is the only way back to the local clipboard
set -g set-clipboard on

# Yanks go to the system clipboard: pbcopy on macOS, wl-copy where it
# exists, otherwise OSC 52 through the terminal (set-clipboard above)
if-shell 'uname | grep -q Darwin' \
    'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"' \
    "if-shell 'command -v wl-copy' \
        'bind -T copy-mode-vi y send -X copy-pipe-and-cancel \"wl-copy\"' \
        'bind -T copy-mode-vi y send -X copy-selection-and-cancel'"

