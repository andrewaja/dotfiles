##### --- General Options ---

# Enable mouse support
set -g mouse on

# Use 256-color terminal
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",tmux-256color:Tc"

# Visuals: borders and colors
set -g pane-border-style fg=black
set -g pane-active-border-style fg=green

# Status bar customization
set -g status on
set -g status-bg colour235
set -g status-fg colour136
set -g status-left "#[fg=green]#H#[default] "
set -g status-right "#[fg=yellow]#(cut -d' ' -f1 /proc/loadavg)#[default] #[fg=white]%Y-%m-%d %H:%M#[default]"

# Window and pane titles
setw -g automatic-rename on
setw -g window-status-format "#[fg=cyan]#I:#W#[default]"
setw -g window-status-current-format "#[fg=green]#I:#W#[default]"


##### --- Set Key Binds ---

# Copy mode uses vi keys
setw -g mode-keys vi

# Set vim keybinds for selection
bind -T copy-mode-vi v if-shell -F '#{selection_present}' 'send -X clear-selection' 'send -X begin-selection'
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi Escape send -X cancel

# Yank selection with 'y', clean non-ASCII prefix, trim leading/trailing whitespace, copy to Windows clipboard
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "iconv -f utf-8 -t ascii//IGNORE | sed 's/^[[:space:]]*//; s/[[:space:]]*\$//' | clip.exe"

# Auto-copy on mouse selection (without pressing y)
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "iconv -f utf-8 -t ascii//IGNORE | sed 's/^[[:space:]]*//; s/[[:space:]]*\$//' | clip.exe"
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "iconv -f utf-8 -t ascii//IGNORE | sed 's/^[[:space:]]*//; s/[[:space:]]*\$//' | clip.exe"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "iconv -f utf-8 -t ascii//IGNORE | sed 's/^[[:space:]]*//; s/[[:space:]]*\$//' | clip.exe"


##### --- Pane Management ---

# Split panes
bind | split-window -h
bind - split-window -v

# Move between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Swap panes
bind H run-shell 'tmux swap-pane -t !; tmux select-pane -L'
bind L run-shell 'tmux swap-pane -t !; tmux select-pane -R'

# Resize panes with Alt + hjkl
bind -n M-h resize-pane -L 2
bind -n M-l resize-pane -R 2
bind -n M-j resize-pane -D 2
bind -n M-k resize-pane -U 2


##### --- Session Management ---

# Create new session easily
bind n command-prompt -p "New session name:" "new-session -s '%%'"


##### --- TPM Plugin Manager ---

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'jimeh/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Resurrect options
set -g @resurrect-save-dir 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-save-command-history 'on'

# When detaching or killing session, trigger pane content save
set-hook -g session-closed 'run-shell "~/.tmux/save_all_nvim_sessions.sh"'
set-hook -g client-detached 'run-shell "~/.tmux/save_all_nvim_sessions.sh"'

# Initialize TPM (keep this at the bottom)
run -b '~/.tmux/plugins/tpm/tpm'

